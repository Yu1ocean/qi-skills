<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出差目的地图实验页</title>
  <script src="https://sf-unpkg-src.bytedance.net/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #06111f;
      --panel: #081424;
      --panel-2: rgba(9, 21, 38, 0.9);
      --line: rgba(91, 162, 255, 0.24);
      --cyan: #4fd6ff;
      --green: #46e0bb;
      --orange: #ffbf66;
      --red: #ff6a7f;
      --text: #ecf4ff;
      --muted: #9bb0d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,88,162,0.08), transparent 28%),
        radial-gradient(circle at 75% 30%, rgba(23,74,138,0.06), transparent 24%),
        linear-gradient(180deg, #071321 0%, #050c18 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .frame {
      width: min(1380px, 96vw);
      min-height: 760px;
      border: 1px solid rgba(84, 134, 202, 0.18);
      background: linear-gradient(180deg, rgba(7, 17, 31, 0.96), rgba(4, 10, 20, 0.98));
      box-shadow: 0 30px 90px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(103, 163, 241, 0.04);
      padding: 18px 18px 22px;
    }
    .title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .panel {
      position: relative;
      height: 680px;
      border: 1px solid rgba(84, 134, 202, 0.16);
      background: linear-gradient(180deg, rgba(6,15,29,0.94), rgba(3,9,18,0.98));
      overflow: hidden;
    }
    .world-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.1;
    }
    .world-bg svg { width: 100%; height: 100%; display: block; }
    .box {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 88%;
      height: 86%;
      transform: translate(-50%, -50%);
      border-radius: 28px;
      border: 1px solid rgba(202, 237, 255, 0.82);
      background: linear-gradient(180deg, rgba(10,22,40,0.68), rgba(8,18,34,0.82));
      box-shadow:
        0 0 0 1px rgba(92, 176, 255, 0.22),
        0 22px 70px rgba(0,0,0,0.38),
        inset 0 0 0 1px rgba(225, 243, 255, 0.18),
        inset 0 24px 68px rgba(79,214,255,0.08),
        0 0 56px rgba(79,214,255,0.08);
      overflow: hidden;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1px solid rgba(205, 235, 255, 0.18);
      background: radial-gradient(circle at 52% 45%, rgba(58, 124, 204, 0.12), rgba(8, 18, 34, 0.02) 58%, transparent 76%);
      pointer-events: none;
      z-index: 0;
    }
    #chart {
      position: absolute;
      inset: 18px;
      z-index: 1;
    }
    .meta {
      position: absolute;
      top: 16px;
      right: 22px;
      z-index: 3;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="title">出差目的地图 · 独立实验页</div>
    <div class="panel">
      <div class="world-bg">
        <svg viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="rgba(130,180,255,0.24)" stroke-width="0.16">
            <path d="M4 5.5 H96 V54.5 H4 Z"></path>
            <path d="M10 8 V52"></path><path d="M22 8 V52"></path><path d="M34 8 V52"></path><path d="M46 8 V52"></path><path d="M58 8 V52"></path><path d="M70 8 V52"></path><path d="M82 8 V52"></path>
            <path d="M7 14 H93"></path><path d="M7 22 H93"></path><path d="M7 30 H93"></path><path d="M7 38 H93"></path><path d="M7 46 H93"></path>
          </g>
          <g fill="rgba(90,135,200,0.16)" stroke="rgba(160,210,255,0.14)" stroke-width="0.18">
            <path d="M7.5 13.5 L14.5 10.8 L21.5 11.6 L25.3 15.1 L24.6 20.7 L19.2 23.8 L12.2 23.1 L8.6 19.4 Z"></path>
            <path d="M18.8 24.3 L22.6 24.9 L25.8 29.5 L24.8 36.8 L21.2 43.6 L17.9 42.4 L16.7 35.1 L17.4 28.1 Z"></path>
            <path d="M31.5 13.2 L36.4 11.5 L43.1 12.4 L47.4 15.8 L48.3 19.8 L44.9 22.9 L39.4 23.2 L34.4 21.1 Z"></path>
            <path d="M50.4 14.1 L57.1 12.5 L66.8 13.3 L72.4 16.4 L72.8 20.8 L67.1 23.9 L58.2 24.2 L52.8 21.4 Z"></path>
            <path d="M54.2 25.6 L61.5 24.8 L67.7 26.5 L70.8 30.8 L69.1 35.8 L61.8 37.7 L55.6 35.4 L52.4 30.4 Z"></path>
            <path d="M70.8 18.7 L76.7 17.2 L81.4 18.5 L83.5 22.4 L81.9 26.5 L77.1 27.2 L72.9 24.9 Z"></path>
          </g>
          <text x="8" y="11" fill="rgba(180,210,240,0.22)" font-size="2.1">WORLD</text>
        </svg>
      </div>
      <div class="box">
        <div id="chart"></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <script>
    function cssVar(name, fallback) {
      const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return value || fallback;
    }

    async function boot() {
      const [dataResp, geoResp] = await Promise.all([
        fetch('./travel_dashboard.prod.json', { cache: 'no-store' }),
        fetch('./china.json', { cache: 'no-store' })
      ]);
      const data = await dataResp.json();
      const geoJson = await geoResp.json();
      echarts.registerMap('travel-china-exp', geoJson);

      const trips = (data.trips || []).filter(t => t.departure_coord && t.destination_coord);
      const citySeen = new Map();
      const regularLineData = [];
      const firstLineData = [];

      trips.forEach(item => {
        const from = [Number(item.departure_coord.lon), Number(item.departure_coord.lat)];
        const to = [Number(item.destination_coord.lon), Number(item.destination_coord.lat)];
        if (!Number.isFinite(from[0]) || !Number.isFinite(from[1]) || !Number.isFinite(to[0]) || !Number.isFinite(to[1])) return;
        citySeen.set(item.departure_city, { name: item.departure_city, value: from, role: '出发城市' });
        citySeen.set(item.destination_city, { name: item.destination_city, value: to, role: item.is_first_time_destination ? '首次差旅地' : '目的地' });
        const line = { coords: [from, to], value: `${item.name}｜${item.departure_city} → ${item.destination_city}`, firstTime: !!item.is_first_time_destination };
        (item.is_first_time_destination ? firstLineData : regularLineData).push(line);
      });

      const cityData = Array.from(citySeen.values());
      document.getElementById('meta').textContent = `${trips.length} 条有效航线｜标注 ${cityData.length} 城市`;

      const chart = echarts.init(document.getElementById('chart'));
      chart.setOption({
        animationDuration: 700,
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(6,18,34,0.92)',
          borderColor: 'rgba(79,214,255,0.25)',
          textStyle: { color: '#eaf5ff' },
          formatter(params) {
            if (params.seriesName === '常规线路' || params.seriesName === '首次线路') return `${params.data.value}${params.data.firstTime ? '<br/>⚠️ 首次差旅地' : ''}`;
            return params.data.name || '';
          }
        },
        geo: {
          map: 'travel-china-exp',
          roam: false,
          left: '1.5%',
          right: '1.5%',
          top: '1.5%',
          bottom: '2.5%',
          itemStyle: {
            areaColor: 'rgba(57, 128, 205, 0.58)',
            borderColor: 'rgba(201, 237, 255, 0.92)',
            borderWidth: 1.15,
            shadowBlur: 20,
            shadowColor: 'rgba(79,214,255,0.18)'
          },
          emphasis: { disabled: true },
          regions: [{
            name: '南海诸岛',
            itemStyle: {
              areaColor: 'rgba(57,128,205,0.24)',
              borderColor: 'rgba(201,237,255,0.4)'
            }
          }]
        },
        series: [
          {
            name: '常规线路',
            type: 'lines',
            coordinateSystem: 'geo',
            zlevel: 2,
            effect: { show: true, constantSpeed: 34, trailLength: 0.18, symbolSize: 5, color: cssVar('--cyan', '#4fd6ff') },
            lineStyle: { width: 1.4, color: 'rgba(79,214,255,0.42)', curveness: 0.18, opacity: 0.8 },
            data: regularLineData
          },
          {
            name: '首次线路',
            type: 'lines',
            coordinateSystem: 'geo',
            zlevel: 3,
            effect: { show: true, constantSpeed: 40, trailLength: 0.24, symbolSize: 7, color: cssVar('--red', '#ff6a7f') },
            lineStyle: { width: 2.3, color: 'rgba(255,106,127,0.86)', curveness: 0.22, opacity: 0.96, shadowBlur: 12, shadowColor: 'rgba(255,106,127,0.35)' },
            data: firstLineData
          },
          {
            name: '城市标注',
            type: 'effectScatter',
            coordinateSystem: 'geo',
            zlevel: 5,
            rippleEffect: { scale: 2.8, brushType: 'stroke' },
            symbolSize: val => val && val[2] === '首次差旅地' ? 12 : 9,
            itemStyle: {
              color: params => params.data.role === '出发城市' ? cssVar('--green', '#46e0bb') : params.data.role === '首次差旅地' ? cssVar('--red', '#ff6a7f') : cssVar('--orange', '#ffbf66'),
              shadowBlur: 14,
              shadowColor: 'rgba(79,214,255,0.42)'
            },
            label: {
              show: true,
              color: '#eaf5ff',
              fontSize: 12,
              padding: [3, 7],
              backgroundColor: 'rgba(7,16,30,0.76)',
              borderRadius: 6,
              formatter(params) { return params.data.name || ''; }
            },
            labelLayout: { hideOverlap: true, moveOverlap: 'shiftY' },
            data: cityData.map(item => ({
              ...item,
              value: [...item.value, item.role],
              label: item.role === '出发城市' ? { position: 'left', offset: [-10, 0] } : { position: 'right', offset: [10, 0] }
            }))
          }
        ]
      });

      window.addEventListener('resize', () => chart.resize());
    }
    boot();
  </script>
</body>
</html>
