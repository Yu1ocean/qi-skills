# ============================================================================
# live-material-fraud-auditor v2.0 语义违规判定配置（Semantic Audit Config）
# ----------------------------------------------------------------------------
# 设计原则：不维护关键词库。每类违规只用一段自然语言 judge_prompt 描述判定标准，
#          由大模型做语义理解，抗「换个说法就绕过」的规避。
# 规则来源：TikTok Shop 达人及内容规则白皮书 2.2（2026-06-30）
#          https://bytedance.sg.larkoffice.com/docx/YIxgdMHCPoYXZpxGNSLlEBC9gQe
# ============================================================================

meta:
  config_version: "2.0"
  rule_source_doc: "https://bytedance.sg.larkoffice.com/docx/YIxgdMHCPoYXZpxGNSLlEBC9gQe"
  rule_source_title: "TikTok Shop-达人及内容规则白皮书2.2（对外）"
  rule_source_updated_at: "2026-06-30"
  audit_target: "直播回放逐字稿（主播口播内容），不含商品详情页与画面"

# 全局判定策略
judge_policy:
  window_lines: 24               # 每个判定窗口的逐字稿行数
  window_overlap_lines: 3        # 窗口重叠行数，防止跨窗语义被切断
  context_scope: "window"        # 判定语境范围：window（整窗语境）> line（单行）
  risk_levels: ["高", "中", "低"]
  # 反幻觉铁律：证据原文必须能在逐字稿中物理定位，否则该条命中作废并隔离
  require_verbatim_evidence: true
  # 判不准就交人工，不许模型强行定性
  low_confidence_to_human_review: 0.7
  # 未启用的违规类型绝不允许出现在输出里
  reject_unknown_type: true

violation_types:

  # ---------------------------------------------------------------- 1. 材质造假
  - id: material_fraud
    name: 材质造假宣称
    name_en: Material Fraud Claim
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否对商品材质做了无法成立或未加限定的宣称。属于违规的语义包括：
      (a) 把镀金/合金/包金饰品说成含真实贵金属（如声称是真金、纯金、含金量达到某个 K 数、
          带 14K/18K 印记即等于实心金），却没有明确澄清「镀层/包金/plated」；
      (b) 宣称永久性物理属性，如永不褪色、永不变黑、永不氧化、不会让皮肤发绿、
          可以一直戴着洗澡/游泳/泡温泉而毫无影响；
      (c) 宣称防水、防刮、实心不空心等物理强度，但语境显示这是廉价饰品或无任何检测依据；
      (d) 用伪科学检测背书材质真实性，如「通过钻石笔测试」「磁铁吸不住所以是真金」
          「过火不变色所以是真金」。
      注意：主播明确说明「gold plated / 镀金 / 电镀层 / 日常佩戴注意避水」等限定表述时，
      不构成违规，不要报。
    risk_rubric:
      高: "真金/纯金/K 金实心宣称 与 印记/检测背书 叠加出现，且全窗无任何镀层澄清"
      中: "单点出现永久防水、永不褪色、永不氧化一类绝对化材质承诺"
      低: "材质表述含糊但有限定词（如 looks like gold / gold tone / 镀金款）"

  # ------------------------------------------------------ 2. 品牌授权/正品宣称
  - id: brand_authorization
    name: 品牌授权与正品宣称
    name_en: Brand Authorization / Authenticity Claim
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断主播是否声称自己或店铺获得品牌授权、是官方渠道、所售为品牌正品。属于违规语义包括：
      (a) 自称 official store / officially authorized / brand partner / 官方旗舰 / 品牌直营，
          而语境无法证明该授权关系；
      (b) 声称商品为 genuine / authentic / 100% original 品牌货；
      (c) 提及奢侈品或知名品牌名（如 Rolex、Cartier、Tiffany、Van Cleef、Chanel、Dior、
          Hermès、Pandora、Swarovski 等）并暗示所售商品即该品牌产品或与其同源同厂。
      当上述宣称与材质宣称（真金、K 金印记）在同一窗口叠加出现时，视为「用品牌背书假材质」，
      风险升到高。
      ⚠️ ASR 误识别陷阱：中文口语「老主顾 / 老顾客 / 我朋友」等可能被误转写为 official，
      英文 all the shows / a fisher 也可能误转为 official。凡命中此类必须标记需人工回听。
    risk_rubric:
      高: "授权/正品宣称 与 材质宣称或品牌名 叠加出现"
      中: "单独出现 official / authorized / genuine 类宣称"
      低: "仅提及品牌名做风格类比（如 dupe / inspired by / 同款风格）且明确不是该品牌"

  # --------------------------------------------------------- 3. 假货/仿冒品（新增）
  - id: counterfeit
    name: 假货与仿冒品
    name_en: Counterfeit / Replica
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断主播是否在推广仿冒品、高仿、平替假货，或以暗语规避审核地售卖假货。属于违规语义包括：
      (a) 直接使用 replica / fake / knockoff / 1:1 / mirror quality / super clone /
          AAA quality / 高仿 / 精仿 / 复刻 等表述；
      (b) 声称与正品同厂同料、原单尾单、跟专柜一模一样别人分辨不出来；
      (c) 明示或暗示商品带有他人品牌 logo、标牌、包装但并非该品牌授权生产；
      (d) 用规避性暗语指代品牌（如「大 C 家」「双 G」「那个法国牌子」「你们懂的那个牌子」）
          并强调「和正品无差别」；
      (e) 引导观众私下交流以获取「更像正品」的版本或私域下单。
      注意：明确定位为「设计相似的独立品牌平价款」且不冒用他人品牌标识、不声称同厂同料的，
      不构成假货违规（可能仍触发 brand_authorization，请交由该类型判断）。
    risk_rubric:
      高: "明确的仿冒表述（replica/1:1/高仿/原单）或声称与正品无差别"
      中: "用暗语指代品牌 + 暗示同厂同料，但未直说仿冒"
      低: "仅提到 dupe / inspired style，未冒用品牌标识也未声称同源"

  # ------------------------------------------------- 4. 商品属性不准确（货不对板）
  - id: product_attribute_mismatch
    name: 商品属性不准确
    name_en: Inaccurate Product Attributes
    enabled: true
    modality: audio+visual
    force_human_review: false
    judge_prompt: |
      判断主播口播的商品信息是否与实际售卖商品不一致，即「货不对板」。属于违规语义包括：
      规格数量不符（说 5 件套实际 1 件）、尺码尺寸不符、颜色材质与链接不符、
      成分/产地/品牌不符、把赠品说成主品、用高配款演示却卖低配款、
      演示的商品与挂车链接不是同一件（挂 A 讲 B）。
    risk_rubric:
      高: "数量、规格、成分、产地等核心属性被明确说错，直接影响购买决策"
      中: "属性表述含糊或前后矛盾，存在误解空间"
      低: "非核心属性的口误，且窗口内已自行更正"

  # ------------------------------------------------------- 5. 商品定价模糊/虚假定价
  - id: misleading_pricing
    name: 商品定价模糊与虚假定价
    name_en: Misleading Pricing
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播的价格表述是否模糊或虚假。属于违规语义包括：
      (a) 口播价格与实际结算价不一致，或只报最低规格价却用于全系列引导；
      (b) 使用无法核查的原价/专柜价做对比（如「原价 200 现在 9.9」），或虚构历史价；
      (c) 声称全网最低价、绝对最便宜、买不到更低的、比任何平台都便宜等绝对化价格宣称；
      (d) 隐瞒必要费用（运费、税费、附加购买条件）却宣称「到手价」；
      (e) 制造虚假限时限量压力（如反复宣称最后 3 单、库存马上没了）而实际持续放量。
    risk_rubric:
      高: "绝对化最低价宣称，或口播价与实付价明确不一致"
      中: "无法核查的原价对比，或隐瞒运费税费的到手价宣称"
      低: "价格表述含糊但未做虚假对比"

  # ------------------------------------------------------------ 6. 误导性折扣内容
  - id: misleading_discount
    name: 误导性折扣内容
    name_en: Misleading Discount Content
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播描述的折扣、优惠、券后价是否构成误导。属于违规语义包括：
      推广已过期或尚未生效的活动；宣称的折扣力度与实际可用券不符；
      把需要叠加多重条件（新客专享、下载 App、关注满额）的价格说成人人可得；
      宣称「免费送/0 元拿」但实际需要支付运费或购买其他商品；
      虚构平台补贴、官方立减等不存在的优惠来源。
      与 misleading_pricing 的分工：本类型聚焦**折扣与优惠条款的披露与真实性**，
      价格数值本身虚假归 misleading_pricing。
    risk_rubric:
      高: "宣称不存在的优惠或虚构平台补贴，或折扣与实际严重不符"
      中: "隐瞒折扣使用门槛与叠加条件"
      低: "折扣表述不严谨但未实质误导"

  # --------------------------------------------------------- 7. 夸大宣传与绝对化用语
  - id: exaggerated_absolute_claims
    name: 夸大宣传与绝对化用语
    name_en: Exaggerated / Absolute Claims
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否对商品效果、品质、销量、资质做了无依据的夸大或绝对化宣称。违规语义包括：
      (a) 绝对化用语：世界第一、销量第一、No.1、最好、唯一、百分百有效、保证见效、
          零副作用、永久有效；
      (b) 虚构权威背书：获得某认证/专利/奖项、被官方推荐、明星同款代言，但无任何依据；
      (c) 虚构销量与口碑：卖了几百万单、全网爆火、所有人都在买；
      (d) 承诺不可实现的结果：用了一定变白、一定长头发、一定瘦下来。
      与 medical_efficacy_claims 的分工：涉及疾病、治疗、医疗功效的归第 8 类；
      本类型处理非医疗类的夸大与绝对化。
    risk_rubric:
      高: "绝对化功效或效果保证（保证见效/百分百有效/一定能）"
      中: "虚构权威背书、认证、奖项、销量数据"
      低: "带限定词的效果描述（helps / may / 因人而异）但仍偏夸张"

  # -------------------------------------------------------- 8. 医疗功效/疾病宣称
  - id: medical_efficacy_claims
    name: 医疗功效与疾病宣称
    name_en: Medical Efficacy Claims
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否将非药品商品宣称为具备医疗功效，或围绕疾病做推广。违规语义包括：
      声称可以治疗/治愈/预防/缓解具体疾病（糖尿病、高血压、癌症、湿疹、抑郁、脱发等）；
      声称替代药物或医疗手段、可以停药；宣称临床验证、FDA 批准、医生推荐、
      医院同款、药用级；用疾病症状恐吓引导购买；对普通食品/化妆品/器械宣称疗效。
    risk_rubric:
      高: "明确宣称治疗、治愈、预防疾病，或声称 FDA 批准/临床验证/可替代药物"
      中: "暗示医疗功效或用疾病恐吓引导（如「有这些症状就要赶紧调理」）"
      低: "带限定的舒缓类表述（helps soothe / may relieve discomfort）"

  # ------------------------------------------------------------ 9. 体重管理声明
  - id: weight_management_claims
    name: 体重管理声明
    name_en: Weight Management Claims
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播关于减重、塑形、身材的表述是否违规。违规语义包括：
      承诺具体减重数字或时限（一周瘦 10 斤、月瘦 20 磅）；宣称不运动不控食即可瘦、
      局部定点减脂、燃脂爆脂、抑制食欲代谢黑科技；
      推广处方类减重药物或其平替（如 GLP-1、司美格鲁肽类语义）；
      羞辱身材、制造体型焦虑（如说胖就是不自律、不瘦下来没人爱）；
      针对未成年人推广减重商品。
    risk_rubric:
      高: "承诺具体减重数字/时限，或推广处方减重药及其平替"
      中: "宣称燃脂、局部瘦、抑制食欲等无依据机制"
      低: "泛泛的身材管理鼓励，但含身材焦虑倾向表述"

  # ---------------------------------------------- 10. 性健康与私密护理产品推广
  - id: sexual_wellness_promotion
    name: 性健康与私密护理产品推广
    name_en: Sexual Wellness Product Promotion
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断主播推广性健康、计生用品或私密护理商品时是否越界。违规语义包括：
      露骨描述性行为、性快感、性能力提升；宣称壮阳、延时、催情、提高性功能等功效；
      用性暗示玩笑或俚语调动气氛；描述私密部位使用过程时使用挑逗性语言；
      对私密护理品宣称治疗妇科疾病、杀菌治炎（此项亦触发第 8 类）。
      合规做法是：只讲成分温和、使用场景、卫生便利、材质安全，语气中性信息化。
    risk_rubric:
      高: "露骨性描述，或宣称壮阳/延时/催情等功效"
      中: "使用性暗示俚语、挑逗性玩笑调动直播间氛围"
      低: "表述略显暧昧但整体保持中性信息性"

  # ------------------------------------------------------------ 11. 禁限售商品推广
  - id: prohibited_restricted_goods
    name: 禁限售商品推广
    name_en: Prohibited / Restricted Goods
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断主播是否在推广平台禁售或限售商品，包括用暗语规避审核的情形。违规语义包括：
      武器弹药与管制刀具、电子烟与烟草及其配件、酒精饮品（在限售市场）、
      处方药与管制物质、大麻/CBD 类、成人用品、活体动物、濒危物种制品、
      仿冒品（另见第 3 类）、监控偷拍设备、破解与外挂服务、虚拟货币与金融产品、
      医疗器械（无资质）、隐形眼镜、婴幼儿配方（在限售市场）。
      同时警惕暗语规避：用谐音、拼音缩写、emoji、行业黑话指代禁售品，
      或引导「私聊拿全套」「懂的人自然懂」。
    risk_rubric:
      高: "明确推广禁售品，或用暗语引导私下交易禁售品"
      中: "推广限售品但未说明资质与市场限制"
      低: "提及相关品类但无销售引导"

  # --------------------------------------------------------- 12. 赌博与类赌博玩法
  - id: gambling_and_gamified
    name: 赌博与类赌博玩法
    name_en: Gambling / Gambling-like Mechanics
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否在直播中组织赌博或带有赌博性质的玩法。违规语义包括：
      开盲盒式「拆珠子/开蚌/开原石」并以「赌运气、可能开出上万元」做核心卖点；
      让观众下单赌结果、押大小、猜数字、竞猜给奖；
      推广赌场、彩票、体育博彩、棋牌与线上赌博平台；
      用「以小博大、一单翻十倍、上车就有机会中大奖」等赌性话术刺激下单。
      注意：平台官方支持的抽奖/福袋功能本身不违规，但若话术强调赌博性收益仍需报。
    risk_rubric:
      高: "组织下单博结果的赌局，或推广赌博平台与博彩"
      中: "开盲盒式玩法以赌运气获利为核心卖点"
      低: "使用轻度赌性话术但无实际赌博机制"

  # ------------------------------------------------------------ 13. 赠品与促销违规
  - id: giveaway_promotion_violation
    name: 赠品与促销违规
    name_en: Giveaway / Promotion Violation
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播组织的赠品、抽奖、福利活动是否违规。违规语义包括：
      未使用平台官方抽奖/福袋功能而私下组织抽奖；
      要求观众为参与抽奖付费、下单、充值、送礼物；
      要求观众加外部群、私信、关注站外账号才能参与（此项亦触发第 15 类）；
      未说明中奖规则、开奖时间、奖品数量与发货责任；
      承诺人人有奖或必中却无法兑现；用抽奖名义收集观众个人信息。
    risk_rubric:
      高: "要求付费/下单/送礼才能参与抽奖，或引导站外参与"
      中: "私下组织抽奖未走官方功能，规则不透明"
      低: "抽奖规则表述不完整但无付费门槛"

  # -------------------------------------------------------------- 14. 拍卖违规
  - id: auction_violation
    name: 拍卖违规
    name_en: Auction Violation
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否在未使用平台官方拍卖功能的情况下组织竞价。违规语义包括：
      在评论区喊价竞拍、让观众刷数字出价、私下约定成交价再改价下单；
      临时改价/临时上架专属链接以完成竞价成交；
      承诺拍中不买不追责、或对未拍中者施压；
      拍卖标的为禁限售品或来源不明商品。
    risk_rubric:
      高: "评论区喊价竞拍并私下改价成交，绕过官方拍卖功能"
      中: "组织类竞价玩法但成交仍走正常链接"
      低: "提及拍卖概念但无实际竞价行为"

  # -------------------------------------------------------- 15. 诱导站外引流
  - id: off_platform_diversion
    name: 诱导站外引流
    name_en: Off-Platform Diversion
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否引导观众离开平台完成交易或联系。违规语义包括：
      口播或引导观众查看简介里的外部链接、网站、其他电商平台店铺；
      提供电话号码、微信/WhatsApp/Telegram/Line/Instagram 等联系方式或 ID；
      让观众私信、加群、关注站外账号以拿更低价或更多款式；
      宣称「平台外下单更便宜/可以避税/可以走私人渠道」；
      推广站外优惠、第三方促销或自建独立站。
      注意：引导站内点赞、关注、评论、分享、点购物车不构成违规。
    risk_rubric:
      高: "明确给出站外联系方式或引导站外下单"
      中: "暗示私信/加群可获更优价格，但未直接给出联系方式"
      低: "提及自己在其他平台也有账号但无引导交易意图"

  # --------------------------------------------- 16. 欺诈/刷单/冒充/卖惨博同情
  - id: fraud_traffic_manipulation
    name: 欺诈、刷单与冒充行为
    name_en: Fraud / Traffic Manipulation / Impersonation
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断主播是否存在欺诈、滥用平台机制或冒充身份的行为。违规语义包括：
      (a) 组织或暗示刷单、空包、自买自卖、互刷流量、批量下单再退款；
      (b) 诱导观众下单后走特定退款话术以套取补贴或运费券；
      (c) 冒充官方客服、平台工作人员、品牌方、名人明星或医生等专业身份；
      (d) 编造悲惨故事博同情促单（如声称重病、破产清仓、亲人去世、不卖就活不下去），
          或编造「老板不知道、偷偷给你们放价」等虚假情境；
      (e) 虚构紧急事件制造抢购恐慌（如声称链接马上被封、明天就下架永远买不到）。
      ⚠️ ASR 陷阱：主播讲述真实经历与编造卖惨在文本上难以区分，凡命中必须人工回听定性。
    risk_rubric:
      高: "组织刷单/退款套利，或冒充官方与专业身份"
      中: "编造卖惨故事或虚假情境博同情促单"
      低: "使用轻度紧迫话术但无编造事实"

  # ------------------------------------------------------- 17. 恶意比较与贬低竞品
  - id: malicious_comparison
    name: 恶意比较与贬低竞品
    name_en: Malicious Comparison
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播是否通过贬低他人来推销。违规语义包括：
      点名或指向性地攻击其他商家、达人、品牌，称其卖假货、骗人、质量差；
      未经证实地宣称竞品有害健康、用了会烂脸/致癌；
      拉踩具体平台或店铺（如「别家都是骗你的，只有我这里是真的」）；
      使用未经验证的对比测试贬低竞品。
    risk_rubric:
      高: "点名攻击竞品并指控其违法、有害或造假"
      中: "指向性拉踩但未点名，或用未经验证的对比贬低"
      低: "泛泛强调自家更好，带轻微比较色彩"

  # ------------------------------------------------------------ 18. 慈善捐赠声明
  - id: charity_claims
    name: 慈善捐赠声明
    name_en: Charity Claims
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断主播是否作出无法核实的慈善或公益承诺。违规语义包括：
      声称销售额的一定比例将捐赠给某组织、为某群体（患病儿童、灾区、流浪动物）募捐，
      但未说明受赠机构、捐赠比例与核查方式；
      冒用公益组织名义或标识；用公益名义施压下单（不买就是没有爱心）。
    risk_rubric:
      高: "冒用公益组织名义，或以慈善名义施压募款"
      中: "承诺捐赠但无受赠方、比例与核查信息"
      低: "泛泛表达公益意愿，无具体捐赠承诺"

  # ------------------------------------------------- 19. 知识产权与肖像权侵权
  - id: ip_portrait_infringement
    name: 知识产权与肖像权侵权
    name_en: IP / Portrait Rights Infringement
    enabled: true
    modality: audio+visual
    force_human_review: true
    judge_prompt: |
      判断主播是否在未授权情况下使用第三方权利。违规语义包括：
      口播使用他人商标、品牌名、角色名（迪士尼、漫威、宝可梦、Hello Kitty 等）
      为商品背书或指代商品来源；
      声称使用了某明星/网红的形象、声音、姓名做代言而无授权；
      播放未授权音乐、影视片段并说明其来源；
      宣称搬运复述他人的测评、脚本或素材。
    risk_rubric:
      高: "明确用未授权品牌/角色/名人为商品背书或声称代言"
      中: "提及第三方 IP 做类比但存在混淆来源风险"
      低: "泛泛提及流行文化元素，无来源混淆"

  # -------------------------------------------------------------- 20. 非原创内容
  - id: non_original_content
    name: 非原创内容
    name_en: Non-Original Content
    enabled: true
    modality: audio
    force_human_review: true
    judge_prompt: |
      判断直播内容是否为非原创或非真人实时讲解。违规语义包括：
      逐字稿呈现明显的 AI 合成配音特征（语速语调机械均匀、无口误无互动、
      完全不回应观众提问、同一段话术在窗口间逐字复现）；
      播放预录视频/录屏并冒充实时直播（如提到「刚才那段」但时间线不连贯）；
      搬运他人直播录像或影视片段充当直播内容；
      纯搬运的商品官方宣传片配音。
      ⚠️ 仅凭逐字稿难以定性，凡命中必须结合画面与音轨人工复核。
    risk_rubric:
      高: "逐字稿呈现完全循环复现的机械话术，无任何实时互动痕迹"
      中: "部分段落疑似 AI 配音或预录，互动稀疏"
      低: "话术模板化程度较高，但存在真实互动"

  # ----------------------------------------------------- 21. AIGC 滥用与披露缺失
  - id: aigc_misuse_and_disclosure
    name: AIGC 滥用与披露缺失
    name_en: AIGC Misuse / Missing Disclosure
    enabled: true
    modality: audio+visual
    force_human_review: true
    judge_prompt: |
      判断内容中的 AI 生成元素是否被滥用或未披露。违规语义包括：
      使用 AI 生成的虚拟主播/数字人讲解却宣称是真人真实使用体验；
      用 AI 生成不可实现的「神奇效果」演示（如一擦即白、一喷长发）；
      AI 换脸/克隆声音冒充名人、医生、官方；
      AI 生成的商品展示与实物严重不符（货不对板，亦触发第 4 类）；
      对显著影响判断的 AI 生成内容未做披露标注。
      注意：仅用 AI 做翻译、配字幕、画质优化、风格化而不改变商品信息的，不违规。
    risk_rubric:
      高: "AI 换脸/克隆声音冒充他人，或 AI 生成虚假神奇效果"
      中: "数字人讲解冒充真人体验，或 AI 内容未披露且影响判断"
      低: "AI 辅助生成但商品信息真实，仅披露不完整"

  # ------------------------------------------------------------ 22. 涉未成年人内容
  - id: minor_involvement
    name: 涉未成年人内容
    name_en: Minor Involvement
    enabled: true
    modality: audio+visual
    force_human_review: true
    judge_prompt: |
      判断内容是否不当涉及或利用未成年人。违规语义包括：
      让未成年人出镜带货、口播卖点或做效果演示；
      向未成年人推广成人向商品（酒精、烟草、成人用品、减重药、美容医疗）；
      利用未成年人形象或处境博同情促单；
      描述未成年人身体特征以推销服饰内衣类商品；
      鼓励未成年人自行下单或提供支付信息。
    risk_rubric:
      高: "让未成年人出镜带货，或向未成年人推广成人向商品"
      中: "利用未成年人形象或处境做情绪化促单"
      低: "提及儿童使用场景但无出镜与不当推广"

  # ------------------------------------------------------------ 23. 裸露与性暗示
  - id: nudity_sexual_suggestive
    name: 裸露与性暗示行为
    name_en: Nudity / Sexually Suggestive Behavior
    enabled: true
    modality: audio+visual
    force_human_review: true
    judge_prompt: |
      从逐字稿判断是否存在性暗示话术（画面裸露需人工看视频，本类型只判语言层面）。
      违规语义包括：
      用性暗示、挑逗、双关俚语描述商品或身体（尤其内衣、泳衣、塑身衣、丝袜类）；
      引导观众关注身体私密部位、评价身材以调动氛围；
      邀约线下或私下的性相关互动；引导至成人平台或成人内容；
      对贴身衣物用「上身给你们看看」「镜头往下一点」等引导性表述。
      合规做法：聚焦面料、舒适度、版型、弹性、设计与日常穿搭场景。
    risk_rubric:
      高: "明确的性邀约、露骨性暗示，或引导至成人内容"
      中: "使用挑逗性双关俚语，或引导关注私密部位"
      低: "描述贴身衣物时表述略显暧昧，整体仍偏产品信息"

  # ------------------------------------------------- 24. 耸人听闻与粗俗冒犯言论
  - id: shocking_offensive_content
    name: 耸人听闻与粗俗冒犯言论
    name_en: Shocking / Offensive Content
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断主播言论是否令人震惊、不适或具有冒犯性。违规语义包括：
      基于种族、性别、宗教、国籍、地域、残障、性取向、体型的歧视与贬损言论；
      仇恨言论、暴力威胁、鼓励自残或危险行为；
      详细描述血腥、伤口、寄生虫、排泄物等令人不适内容以吸引注意；
      恶意咒骂观众、辱骂同行、脏话连篇；
      利用灾难、死亡、疾病等做猎奇噱头。
    risk_rubric:
      高: "歧视性或仇恨言论、暴力威胁、鼓励自残"
      中: "详细描述令人不适内容做噱头，或辱骂性表述"
      低: "偶发粗俗用语，无攻击特定群体"

  # --------------------------------------------------------- 25. 不相关推广内容
  - id: irrelevant_promotion
    name: 不相关推广内容
    name_en: Irrelevant Promotion
    enabled: true
    modality: audio
    force_human_review: false
    judge_prompt: |
      判断直播口播内容是否与挂车商品无关，构成低质量内容。违规语义包括：
      长时间闲聊、唱歌、玩游戏、播放音乐而完全不讲商品；
      讲解内容与所挂商品品类无关（挂饰品讲美食）；
      纯粹重复喊「点小黄车、快下单」而不提供任何商品信息；
      用无关热点、猎奇话题引流后不做商品讲解。
      注意：适度的暖场互动是正常直播节奏，只有当窗口内基本无有效商品信息时才报。
    risk_rubric:
      高: "整段窗口无任何商品信息，纯闲聊或纯催单"
      中: "商品信息稀薄，大部分时间为无关内容"
      低: "存在较长无关闲聊但仍有商品讲解"

  # ------------------------------------------------------- 26. 前后效果对比展示
  - id: before_after_comparison
    name: 前后效果对比展示
    name_en: Before/After Comparison
    enabled: true
    modality: audio+visual
    force_human_review: true
    judge_prompt: |
      判断主播是否使用前后对比来宣称效果。违规语义包括：
      口播「用之前是这样、用完变成这样」并宣称短期显著改变（美白、祛痘、生发、
      瘦身、去皱、牙齿变白）；
      声称对比图/视频为真实用户效果但无从核实；
      暗示效果人人可得、必然出现，未说明个体差异；
      涉及医疗美容或疾病改善的前后对比（亦触发第 8 类）。
      ⚠️ 前后对比通常依赖画面，逐字稿命中后必须人工看视频复核。
    risk_rubric:
      高: "宣称短期显著医疗美容类改变，或声称效果人人必得"
      中: "使用前后对比宣称效果但未说明个体差异"
      低: "提及使用体验变化，无强对比与效果承诺"

  # ------------------------------------------ 27. 静态画面内容（纯视觉，默认关闭）
  - id: static_content
    name: 静态画面内容
    name_en: Static Content
    enabled: false        # 纯画面维度，ASR-only 链路判不了，开启只会造幻觉
    modality: visual
    force_human_review: true
    judge_prompt: |
      判断直播是否长时间处于静态画面（无人出镜、镜头固定不动、只播放静态图或商品图轮播、
      挂机无讲解）。本类型依赖画面帧分析，逐字稿仅能作为辅助信号
      （如长时间完全无语音、只有循环背景音乐）。
      ⚠️ 仅在明确提供画面帧采样输入时才应启用本类型。
    risk_rubric:
      高: "长时间静态画面挂机，无真人讲解"
      中: "间歇性静态画面，讲解稀疏"
      低: "短时静态展示，属正常商品特写"
