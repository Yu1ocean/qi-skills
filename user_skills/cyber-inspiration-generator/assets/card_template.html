<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ SUBJECT }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&family=Share+Tech+Mono&display=swap');
        
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --cyber-yellow: #fcee0a;
            --dark-bg: #050505;
            --terminal-grey: #a0a0a0;
            --terminal-bg: #121212;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .cyber-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Top Section: Cyber Holographic */
        .story-section {
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 50px;
            margin-bottom: 0;
            position: relative;
            clip-path: polygon(0 0, 97% 0, 100% 3%, 100% 100%, 3% 100%, 0 97%);
            z-index: 2;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-pink);
            padding-bottom: 15px;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            color: var(--cyber-yellow);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px var(--neon-pink);
        }

        .visual-container {
            width: 100%;
            margin-bottom: 40px;
            border: 1px solid var(--neon-blue);
            overflow: hidden;
            position: relative;
        }

        .visual-container img {
            width: 100%;
            display: block;
            filter: contrast(1.2) brightness(1.1);
        }

        .story-content {
            font-size: 1.25rem;
            line-height: 2;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            font-weight: 300;
            font-style: italic;
        }

        /* Bottom Section: Cold Terminal Fact */
        .fact-section {
            background-color: var(--terminal-bg);
            border: 2px solid #333;
            border-top: none;
            padding: 30px 50px;
            position: relative;
            z-index: 1;
            font-family: 'Share Tech Mono', 'Noto Sans SC', monospace;
            color: var(--terminal-grey);
            clip-path: polygon(0 0, 100% 0, 100% 95%, 98% 100%, 0 100%);
        }

        .fact-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .fact-content {
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            border-left: 3px solid #444;
            padding-left: 20px;
        }

        .footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            opacity: 0.5;
            color: var(--neon-blue);
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="cyber-container">
        <div class="story-section">
            <div class="header">
                <h1 class="glitch-text">{{ SUBJECT }}</h1>
                <div style="font-family: 'Orbitron'; color: var(--neon-blue);">RECALL_DATE: {{ DATE }}</div>
            </div>
            
            <div class="visual-container">
                <img src="{{ IMAGE_URL }}" alt="Cyber Visual">
            </div>
            
            <div class="story-content">
                {{ STORY_CONTENT }}
            </div>
        </div>
        
        <div class="fact-section">
            <div class="fact-header">
                <span>[ LOG_ENTRY_0x{{ UID }} ]</span>
                <span>STATUS: ARCHIVED</span>
            </div>
            <div class="fact-content">
{{ FACT_CONTENT }}
            </div>
        </div>
    </div>
    
    <div class="footer">
        <div>AIME SYSTEM // PROTOCOL: INSPIRATION</div>
        <div>UID: {{ UID }} // SESSION: {{ DATE }} // STABLE</div>
    </div>
</body>
</html>
